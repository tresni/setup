---
- name: Configuring sudo to accept touch ID
  become: true
  ansible.builtin.copy:
    mode: '0444'
    owner: root
    group: wheel
    src: files/etc/pam.d/sudo_local
    dest: /etc/pam.d/sudo_local

- name: Adding Homebrew ZSH to acceptable shells
  become: true
  ansible.builtin.blockinfile:
    path: /etc/shells
    block: |
      /opt/homebrew/bin/zsh

- name: Configure default $PATH
  become: true
  ansible.builtin.copy:
    mode: '0644'
    owner: root
    group: wheel
    src: files/etc/paths
    dest: /etc/paths
