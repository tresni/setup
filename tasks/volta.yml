---
- name: Check if package is installed via volta
  ansible.builtin.command: volta list --format plain "{{ item }}"
  register: check_result
  check_mode: false
  changed_when: false
  ignore_errors: true
  loop:
    - "node"
    - "@opentabs-dev/cli"
    - "@mermaid-js/mermaid-cli"

- name: Install packages via volta
  ansible.builtin.command: volta install "{{ item.item }}"
  loop: "{{ check_result.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stdout | trim == ""
  changed_when: true
